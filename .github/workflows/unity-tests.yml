name: Unity Tests (EditMode)

# Valida en un Unity real la lógica de las Fases 1-2 (tests EditMode).
# Requiere una licencia de Unity en secrets — ver docs/CI.md.

on:
  push:
    branches: [main, develop, "claude/**"]
    paths:
      - "unity6/**"
      - ".github/workflows/unity-tests.yml"
  pull_request:
    paths:
      - "unity6/**"
      - ".github/workflows/unity-tests.yml"
  workflow_dispatch: {}

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # Cachea la carpeta Library para acelerar imports sucesivos.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: unity6/Library
          key: Library-tag-school-${{ hashFiles('unity6/Packages/manifest.json', 'unity6/Assets/**') }}
          restore-keys: |
            Library-tag-school-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          # Licencia personal: pega el contenido del .ulf en el secret UNITY_LICENSE.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # Licencia Pro/Plus: usa estos tres en su lugar (deja UNITY_LICENSE vacío).
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity6
          unityVersion: 6000.6.0f1
          testMode: editmode
          artifactsPath: editmode-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: editmode-artifacts
          if-no-files-found: warn
